---
applications:
  - name: sdaintai-pipo-rfc-mcp
    path: .
    buildpacks:
      - nodejs_buildpack
    memory: 256M
    instances: 1
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      MCP_USER_1: AYMANK
      MCP_PASS_1: AYMANK
      MCP_USER_2: SAIREDDY
      MCP_PASS_2: SAIREDDY
      # Set these before first push (cf set-env, then cf restage), not committed here:
      # SDAINTAI_SAP_ASHOST / _SYSNR / _CLIENT / _USER / _PASSWD / _LANG
      # Interim option: point these at the same demo system used for
      # SDADATAAI's BW connection to prove connectivity end-to-end, then
      # swap to the real PI/PO host/credentials later -- same five
      # `cf set-env` commands, different values, no code change.
