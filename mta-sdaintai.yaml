_schema-version: 3.3.0
ID: sdaintai-v0
version: 0.0.1
description: "SDAINTAI Platform (ZR_SDAINTAI_V0) — Static Web Console (PI/PO Cockpit), scoped standalone repo"

parameters:
  enable-parallel-deployments: true

modules:

  - name: sdaintai-v0
    type: nodejs
    path: app/aiconx
    parameters:
      buildpack: staticfile_buildpack
      memory: 64M
      disk-quota: 256M
      health-check-type: process
      no-route: false
      routes:
        - route: sdaintai-v0.cfapps.us10.hana.ondemand.com
    build-parameters:
      builder: custom
      commands: []
